<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Content Team</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #222;
}

header {
  background: #111827;
  color: white;
  padding: 22px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 25px;
}

header p {
  margin: 7px 0 0;
  color: #cbd5e1;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 25px;
}

.stat {
  background: white;
  border-radius: 14px;
  padding: 15px 5px;
  text-align: center;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.stat-number {
  font-size: 24px;
  font-weight: bold;
}

.stat-title {
  margin-top: 5px;
  color: #64748b;
  font-size: 13px;
}

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin: 25px 0 12px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card h3 {
  margin-top: 0;
  margin-bottom: 12px;
}

.info {
  color: #64748b;
  line-height: 1.9;
}

.badge {
  display: inline-block;
  background: #e5e7eb;
  color: #374151;
  border-radius: 8px;
  padding: 4px 9px;
  font-size: 12px;
  margin: 3px;
}

.badge.blue {
  background: #dbeafe;
  color: #1d4ed8;
}

.badge.high {
  background: #fee2e2;
  color: #b91c1c;
}

.badge.green {
  background: #dcfce7;
  color: #15803d;
}

.badge.orange {
  background: #ffedd5;
  color: #c2410c;
}

button {
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 13px;
  background: #111827;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  opacity: .9;
}

.add-button {
  background: #2563eb;
}

.edit-button {
  background: #dbeafe;
  color: #1d4ed8;
}

.cancel-button {
  background: #e5e7eb;
  color: #374151;
}

.delete-button {
  background: #fee2e2;
  color: #b91c1c;
}

.task-actions {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.task-actions button {
  margin-top: 0;
  font-size: 12px;
  padding: 10px 5px;
}

.form-group {
  margin-bottom: 15px;
}

.form-label {
  display: block;
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 7px;
  color: #374151;
}

.form-input,
.form-select {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 14px;
  background: white;
  outline: none;
}

.form-input:focus,
.form-select:focus {
  border-color: #2563eb;
}

.form-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.form-buttons button {
  margin-top: 5px;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}

.filter-box {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 15px;
}

.search-input {
  width: 100%;
  padding: 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  margin-bottom: 10px;
}

.search-input:focus {
  border-color: #2563eb;
}

.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.filter-select {
  width: 100%;
  padding: 11px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 13px;
  background: white;
  outline: none;
}

.clear-filter {
  background: #e5e7eb;
  color: #374151;
  margin-top: 10px;
  font-size: 13px;
  padding: 10px;
}

.result-count {
  color: #64748b;
  font-size: 13px;
  margin: 8px 2px 15px;
}

@media (max-width: 500px) {

  .stats {
    grid-template-columns: repeat(2, 1fr);
  }

  .task-actions {
    grid-template-columns: 1fr;
  }

  .filter-grid {
    grid-template-columns: 1fr;
  }

}
</style>
</head>

<body>

<header>
  <h1>Content Team</h1>
  <p>مدیریت تیم تولید محتوا</p>
</header>

<div class="container">

  <div class="stats">

    <div class="stat">
      <div class="stat-number">1</div>
      <div class="stat-title">پروژه</div>
    </div>

    <div class="stat">
      <div class="stat-number">1</div>
      <div class="stat-title">محتوا</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="dashboardTasks">0</div>
      <div class="stat-title">تسک</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="dashboardHigh">0</div>
      <div class="stat-title">اولویت بالا</div>
    </div>

  </div>

  <div class="section-title">
    پروژه‌ها
  </div>

  <div class="card">

    <h3>کافه لیپار</h3>

    <div class="info">

      تولید و مدیریت محتوای شبکه‌های اجتماعی

      <br><br>

      <span class="badge blue">فعال</span>

      <span class="badge">۱ محتوا</span>

      <span class="badge">
        <span id="projectTaskCount">0</span>
        تسک
      </span>

    </div>

    <button onclick="openProject()">
      ورود به پروژه
    </button>

  </div>

</div>

<script>

const STORAGE_KEY = "contentTeamTasks";

const defaultTasks = [
  {
    title: "فیلمبرداری",
    person: "سعید",
    priority: "بالا",
    status: "انجام نشده",
    date: "1405/07/02"
  },
  {
    title: "تدوین",
    person: "مهدی",
    priority: "بالا",
    status: "در حال انجام",
    date: "1405/07/03"
  },
  {
    title: "نوشتن کپشن",
    person: "هژان",
    priority: "عادی",
    status: "انجام نشده",
    date: "1405/07/04"
  },
  {
    title: "تأیید نهایی",
    person: "سعید",
    priority: "بالا",
    status: "انجام شده",
    date: "1405/07/05"
  },
  {
    title: "انتشار",
    person: "هژان",
    priority: "عادی",
    status: "انجام نشده",
    date: "1405/07/06"
  }
];

let savedTasks = localStorage.getItem(STORAGE_KEY);

let tasks;

if (savedTasks) {

  try {
    tasks = JSON.parse(savedTasks);
  }

  catch(error) {
    tasks = [...defaultTasks];
    saveTasks();
  }

}

else {

  tasks = [...defaultTasks];
  saveTasks();

}


/* ذخیره */

function saveTasks() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(tasks)
  );

  updateDashboard();

}


/* داشبورد */

function updateDashboard() {

  const taskCount =
    document.getElementById("dashboardTasks");

  const highCount =
    document.getElementById("dashboardHigh");

  const projectCount =
    document.getElementById("projectTaskCount");


  if (taskCount) {
    taskCount.textContent = tasks.length;
  }

  if (highCount) {

    highCount.textContent =
      tasks.filter(
        task => task.priority === "بالا"
      ).length;

  }

  if (projectCount) {
    projectCount.textContent = tasks.length;
  }

}


/* اولویت */

function getPriorityBadge(priority) {

  if (priority === "بالا") {

    return `
      <span class="badge high">
        اولویت بالا
      </span>
    `;

  }

  if (priority === "کم") {

    return `
      <span class="badge">
        اولویت کم
      </span>
    `;

  }

  return `
    <span class="badge">
      اولویت عادی
    </span>
  `;

}


/* وضعیت */

function getStatusBadge(status) {

  if (status === "انجام شده") {

    return `
      <span class="badge green">
        ✓ انجام شده
      </span>
    `;

  }

  if (status === "در حال انجام") {

    return `
      <span class="badge orange">
        ⏳ در حال انجام
      </span>
    `;

  }

  return `
    <span class="badge">
      ○ انجام نشده
    </span>
  `;

}


/* پروژه */

function openProject() {

  let completed =
    tasks.filter(
      task => task.status === "انجام شده"
    ).length;

  let doing =
    tasks.filter(
      task => task.status === "در حال انجام"
    ).length;

  let pending =
    tasks.filter(
      task => task.status === "انجام نشده"
    ).length;


  let html = `

    <div class="section-title">
      پروژه کافه لیپار
    </div>

    <div class="card">

      <h3>📊 وضعیت پروژه</h3>

      <div class="info">

        وضعیت:
        <span class="badge blue">
          فعال
        </span>

        <br><br>

        کل تسک‌ها:
        <strong>${tasks.length}</strong>

        <br>

        انجام شده:
        <strong>${completed}</strong>

        <br>

        در حال انجام:
        <strong>${doing}</strong>

        <br>

        انجام نشده:
        <strong>${pending}</strong>

      </div>

    </div>


    <div class="section-title">
      🎬 محتواهای پروژه
    </div>

    <div class="card">

      <h3>
        معرفی آیس لاته
      </h3>

      <div class="info">

        <span class="badge">Reel</span>

        <span class="badge">Instagram</span>

        <span class="badge blue">ایده</span>

        <span class="badge high">
          اولویت بالا
        </span>

        <br><br>

        ویدیوی کوتاه معرفی آیس لاته لیپار

      </div>

    </div>


    <div class="section-title">
      ✅ تسک‌های پروژه
    </div>


    <!-- فیلتر و جستجو -->

    <div class="filter-box">

      <input
        id="searchTask"
        class="search-input"
        type="text"
        placeholder="🔎 جستجوی نام تسک..."
        oninput="filterTasks()"
      >

      <div class="filter-grid">

        <select
          id="filterPerson"
          class="filter-select"
          onchange="filterTasks()">

          <option value="">
            👤 همه مسئول‌ها
          </option>

          <option value="سعید">
            سعید
          </option>

          <option value="هژان">
            هژان
          </option>

          <option value="مهدی">
            مهدی
          </option>

        </select>


        <select
          id="filterStatus"
          class="filter-select"
          onchange="filterTasks()">

          <option value="">
            📌 همه وضعیت‌ها
          </option>

          <option value="انجام نشده">
            انجام نشده
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="انجام شده">
            انجام شده
          </option>

        </select>


        <select
          id="filterPriority"
          class="filter-select"
          onchange="filterTasks()">

          <option value="">
            🔥 همه اولویت‌ها
          </option>

          <option value="بالا">
            اولویت بالا
          </option>

          <option value="عادی">
            اولویت عادی
          </option>

          <option value="کم">
            اولویت کم
          </option>

        </select>

      </div>


      <button
        class="clear-filter"
        onclick="clearFilters()">

        پاک کردن فیلترها

      </button>

    </div>


    <div
      id="taskList"
      class="task-list">
    </div>


    <div class="card">

      <button
        class="add-button"
        onclick="showAddTaskForm()">

        + افزودن تسک

      </button>

    </div>


    <button onclick="showDashboard()">

      ← بازگشت به داشبورد

    </button>

  `;


  document.querySelector(".container").innerHTML =
    html;


  renderTasks(tasks);

}


/* نمایش تسک‌ها */

function renderTasks(taskArray) {

  const taskList =
    document.getElementById("taskList");


  if (!taskList) return;


  if (taskArray.length === 0) {

    taskList.innerHTML = `

      <div class="card">

        <div class="empty">

          هیچ تسکی با این مشخصات پیدا نشد.

        </div>

      </div>

    `;

    return;

  }


  let html = `

    <div class="result-count">

      ${taskArray.length}
      تسک نمایش داده می‌شود

    </div>

  `;


  taskArray.forEach(function(item) {

    const task = item.task;
    const index = item.index;


    html += `

      <div class="card">

        <h3>
          ${task.title}
        </h3>

        <div class="info">

          👤 مسئول:
          <strong>
            ${task.person}
          </strong>

          <br>

          ${getPriorityBadge(task.priority)}

          ${getStatusBadge(task.status)}

          <br>

          📅 تاریخ انجام:
          <strong>
            ${task.date || "تعیین نشده"}
          </strong>

        </div>


        <div class="task-actions">

          <button
            class="edit-button"
            onclick="showEditTaskForm(${index})">

            ✏️ ویرایش

          </button>


          <button
            onclick="changeStatus(${index})">

            تغییر وضعیت

          </button>


          <button
            onclick="deleteTask(${index})"
            class="delete-button">

            🗑️ حذف

          </button>

        </div>

      </div>

    `;

  });


  taskList.innerHTML = html;

}


/* فیلتر */

function filterTasks() {

  const search =
    document
      .getElementById("searchTask")
      .value
      .trim()
      .toLowerCase();


  const person =
    document
      .getElementById("filterPerson")
      .value;


  const status =
    document
      .getElementById("filterStatus")
      .value;


  const priority =
    document
      .getElementById("filterPriority")
      .value;


  const filtered =
    tasks
      .map((task, index) => ({
        task: task,
        index: index
      }))
      .filter(item => {

        const task = item.task;


        const matchesSearch =
          !search ||
          task.title
            .toLowerCase()
            .includes(search);


        const matchesPerson =
          !person ||
          task.person === person;


        const matchesStatus =
          !status ||
          task.status === status;


        const matchesPriority =
          !priority ||
          task.priority === priority;


        return (
          matchesSearch &&
          matchesPerson &&
          matchesStatus &&
          matchesPriority
        );

      });


  renderTasks(filtered);

}


/* پاک کردن فیلترها */

function clearFilters() {

  document.getElementById("searchTask").value = "";

  document.getElementById("filterPerson").value = "";

  document.getElementById("filterStatus").value = "";

  document.getElementById("filterPriority").value = "";


  renderTasks(
    tasks.map((task, index) => ({
      task: task,
      index: index
    }))
  );

}


/* داشبورد */

function showDashboard() {

  document.querySelector(".container").innerHTML = `

    <div class="stats">

      <div class="stat">

        <div class="stat-number">
          1
        </div>

        <div class="stat-title">
          پروژه
        </div>

      </div>


      <div class="stat">

        <div class="stat-number">
          1
        </div>

        <div class="stat-title">
          محتوا
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="dashboardTasks">

          ${tasks.length}

        </div>

        <div class="stat-title">
          تسک
        </div>

      </div>


      <div class="stat">

        <div
          class="stat-number"
          id="dashboardHigh">

          ${
            tasks.filter(
              task => task.priority === "بالا"
            ).length
          }

        </div>

        <div class="stat-title">
          اولویت بالا
        </div>

      </div>

    </div>


    <div class="section-title">
      پروژه‌ها
    </div>


    <div class="card">

      <h3>
        کافه لیپار
      </h3>

      <div class="info">

        تولید و مدیریت محتوای شبکه‌های اجتماعی

        <br><br>

        <span class="badge blue">
          فعال
        </span>

        <span class="badge">
          ۱ محتوا
        </span>

        <span class="badge">
          ${tasks.length} تسک
        </span>

      </div>


      <button onclick="openProject()">

        ورود به پروژه

      </button>

    </div>

  `;

}


/* فرم افزودن */

function showAddTaskForm() {

  document.querySelector(".container").innerHTML = `

    <div class="section-title">
      ➕ افزودن تسک جدید
    </div>


    <div class="card">

      <div class="form-group">

        <label class="form-label">
          عنوان تسک
        </label>

        <input
          id="taskTitle"
          class="form-input"
          type="text"
          placeholder="مثلاً طراحی پست اینستاگرام">

      </div>


      <div class="form-group">

        <label class="form-label">
          مسئول
        </label>

        <select
          id="taskPerson"
          class="form-select">

          <option value="">
            انتخاب مسئول
          </option>

          <option value="سعید">
            سعید
          </option>

          <option value="هژان">
            هژان
          </option>

          <option value="مهدی">
            مهدی
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          اولویت
        </label>

        <select
          id="taskPriority"
          class="form-select">

          <option value="">
            انتخاب اولویت
          </option>

          <option value="کم">
            کم
          </option>

          <option value="عادی">
            عادی
          </option>

          <option value="بالا">
            بالا
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          وضعیت
        </label>

        <select
          id="taskStatus"
          class="form-select">

          <option value="انجام نشده">
            انجام نشده
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="انجام شده">
            انجام شده
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          تاریخ انجام
        </label>

        <input
          id="taskDate"
          class="form-input"
          type="text"
          placeholder="مثلاً 1405/07/10">

      </div>


      <div class="form-buttons">

        <button
          class="add-button"
          onclick="saveTaskFromForm()">

          ✓ افزودن تسک

        </button>


        <button
          class="cancel-button"
          onclick="openProject()">

          لغو

        </button>

      </div>

    </div>

  `;

}


/* ذخیره تسک */

function saveTaskFromForm() {

  const title =
    document.getElementById("taskTitle").value.trim();

  const person =
    document.getElementById("taskPerson").value;

  const priority =
    document.getElementById("taskPriority").value;

  const status =
    document.getElementById("taskStatus").value;

  const date =
    document.getElementById("taskDate").value.trim();


  if (!title) {
    alert("لطفاً عنوان تسک را وارد کن.");
    return;
  }

  if (!person) {
    alert("لطفاً مسئول تسک را انتخاب کن.");
    return;
  }

  if (!priority) {
    alert("لطفاً اولویت تسک را انتخاب کن.");
    return;
  }

  if (!date) {
    alert("لطفاً تاریخ انجام را وارد کن.");
    return;
  }


  tasks.push({
    title,
    person,
    priority,
    status,
    date
  });


  saveTasks();

  openProject();

}


/* فرم ویرایش */

function showEditTaskForm(index) {

  const task = tasks[index];


  document.querySelector(".container").innerHTML = `

    <div class="section-title">
      ✏️ ویرایش تسک
    </div>


    <div class="card">

      <div class="form-group">

        <label class="form-label">
          عنوان تسک
        </label>

        <input
          id="taskTitle"
          class="form-input"
          type="text"
          value="${task.title}">

      </div>


      <div class="form-group">

        <label class="form-label">
          مسئول
        </label>

        <select
          id="taskPerson"
          class="form-select">

          <option value="سعید"
            ${task.person === "سعید" ? "selected" : ""}>
            سعید
          </option>

          <option value="هژان"
            ${task.person === "هژان" ? "selected" : ""}>
            هژان
          </option>

          <option value="مهدی"
            ${task.person === "مهدی" ? "selected" : ""}>
            مهدی
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          اولویت
        </label>

        <select
          id="taskPriority"
          class="form-select">

          <option value="کم"
            ${task.priority === "کم" ? "selected" : ""}>
            کم
          </option>

          <option value="عادی"
            ${task.priority === "عادی" ? "selected" : ""}>
            عادی
          </option>

          <option value="بالا"
            ${task.priority === "بالا" ? "selected" : ""}>
            بالا
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          وضعیت
        </label>

        <select
          id="taskStatus"
          class="form-select">

          <option value="انجام نشده"
            ${task.status === "انجام نشده" ? "selected" : ""}>
            انجام نشده
          </option>

          <option value="در حال انجام"
            ${task.status === "در حال انجام" ? "selected" : ""}>
            در حال انجام
          </option>

          <option value="انجام شده"
            ${task.status === "انجام شده" ? "selected" : ""}>
            انجام شده
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          تاریخ انجام
        </label>

        <input
          id="taskDate"
          class="form-input"
          type="text"
          value="${task.date || ""}">

      </div>


      <div class="form-buttons">

        <button
          class="add-button"
          onclick="updateTask(${index})">

          ✓ ذخیره تغییرات

        </button>


        <button
          class="cancel-button"
          onclick="openProject()">

          لغو

        </button>

      </div>

    </div>

  `;

}


/* ذخیره ویرایش */

function updateTask(index) {

  const title =
    document.getElementById("taskTitle").value.trim();

  const person =
    document.getElementById("taskPerson").value;

  const priority =
    document.getElementById("taskPriority").value;

  const status =
    document.getElementById("taskStatus").value;

  const date =
    document.getElementById("taskDate").value.trim();


  if (!title) {
    alert("لطفاً عنوان تسک را وارد کن.");
    return;
  }

  if (!person) {
    alert("لطفاً مسئول تسک را انتخاب کن.");
    return;
  }

  if (!priority) {
    alert("لطفاً اولویت تسک را انتخاب کن.");
    return;
  }

  if (!date) {
    alert("لطفاً تاریخ انجام را وارد کن.");
    return;
  }


  tasks[index] = {
    title,
    person,
    priority,
    status,
    date
  };


  saveTasks();

  openProject();

}


/* تغییر وضعیت */

function changeStatus(index) {

  const current =
    tasks[index].status;

  let nextStatus;


  if (current === "انجام نشده") {
    nextStatus = "در حال انجام";
  }

  else if (current === "در حال انجام") {
    nextStatus = "انجام شده";
  }

  else {
    nextStatus = "انجام نشده";
  }


  tasks[index].status =
    nextStatus;


  saveTasks();

  openProject();

}


/* حذف */

function deleteTask(index) {

  const confirmDelete =
    confirm("آیا از حذف این تسک مطمئنی؟");


  if (!confirmDelete) {
    return;
  }


  tasks.splice(index, 1);

  saveTasks();

  openProject();

}


/* شروع */

updateDashboard();

</script>
