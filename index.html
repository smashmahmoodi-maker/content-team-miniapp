<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Content Team</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 24px 20px;
      background: #111;
      color: white;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: 0.7;
    }

    .section {
      padding: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .project {
      padding: 18px;
      border-radius: 18px;
      background: #f3f3f3;
      margin-bottom: 12px;
    }

    .project-name {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .stats {
      color: #666;
      font-size: 14px;
    }

    .task {
      padding: 16px;
      border: 1px solid #eee;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .task-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .task-user {
      font-size: 14px;
      color: #777;
    }

    .bottom-nav {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-around;
      padding: 14px 5px;
      background: white;
      border-top: 1px solid #eee;
    }

    .nav-item {
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="app">

    <header>
      <h1>Content Team</h1>
      <p>مدیریت تیم تولید محتوا</p>
    </header>

    <div class="section">

      <div class="section-title">
        📁 پروژه‌ها
      </div>

      <div class="project">

        <div class="project-name">
          ☕ کافه لیپار
        </div>

        <div class="stats">
          ۱ محتوا • ۵ وظیفه
        </div>

      </div>

    </div>

    <div class="section">

      <div class="section-title">
        📅 وظایف امروز
      </div>

      <div class="task">

        <div class="task-title">
          🎥 فیلمبرداری
        </div>

        <div class="task-user">
          👤 Saeed
        </div>

      </div>

      <div class="task">

        <div class="task-title">
          ✂️ تدوین
        </div>

        <div class="task-user">
          👤 Mahdi
        </div>

      </div>

      <div class="task">

        <div class="task-title">
          📝 نوشتن کپشن
        </div>

        <div class="task-user">
          👤 Hozhan
        </div>

      </div>

    </div>

    <div class="bottom-nav">

      <div class="nav-item">
        🏠<br>
        خانه
      </div>

      <div class="nav-item">
        📁<br>
        پروژه‌ها
      </div>

      <div class="nav-item">
        📅<br>
        تقویم
      </div>

      <div class="nav-item">
        👤<br>
        من
      </div>

    </div>

  </div>

</body>
</html>
