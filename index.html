<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Team</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 15px 5px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-title {
      margin-top: 5px;
      color: #64748b;
      font-size: 13px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .info {
      color: #64748b;
      line-height: 1.9;
    }

    .badge {
      display: inline-block;
      background: #e5e7eb;
      color: #374151;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      margin: 3px;
    }

    .badge.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge.high {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge.green {
      background: #dcfce7;
      color: #15803d;
    }

    .badge.orange {
      background: #ffedd5;
      color: #c2410c;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .add-button {
      background: #2563eb;
    }

    .cancel-button {
      background: #e5e7eb;
      color: #374151;
    }

    .delete-button {
      background: #fee2e2;
      color: #b91c1c;
    }

    .task-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .task-actions button {
      margin-top: 0;
      font-size: 13px;
      padding: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    .form-input,
    .form-select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      background: white;
      outline: none;
    }

    .form-input:focus,
    .form-select:focus {
      border-color: #2563eb;
    }

    .form-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-buttons button {
      margin-top: 5px;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

  </style>

</head>


<body>

<header>

  <h1>Content Team</h1>

  <p>
    مدیریت تیم تولید محتوا
  </p>

</header>


<div
  class="container"
  id="mainContainer"
>

  <div class="stats">

    <div class="stat">

      <div class="stat-number">
        1
      </div>

      <div class="stat-title">
        پروژه
      </div>

    </div>


    <div class="stat">

      <div class="stat-number">
        1
      </div>

      <div class="stat-title">
        محتوا
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="dashboardTasks"
      >
        5
      </div>

      <div class="stat-title">
        تسک
      </div>

    </div>


    <div class="stat">

      <div
        class="stat-number"
        id="dashboardHigh"
      >
        3
      </div>

      <div class="stat-title">
        اولویت بالا
      </div>

    </div>

  </div>


  <div class="section-title">
    پروژه‌ها
  </div>


  <div class="card">

    <h3>
      کافه لیپار
    </h3>

    <div class="info">

      تولید و مدیریت محتوای شبکه‌های اجتماعی

      <br><br>

      <span class="badge blue">
        فعال
      </span>

      <span class="badge">
        ۱ محتوا
      </span>

      <span class="badge">
        <span id="projectTaskCount">
          ۵
        </span>
        تسک
      </span>

    </div>


    <button onclick="openProject()">
      ورود به پروژه
    </button>

  </div>

</div>



<script>


let tasks = [

  {
    title: "فیلمبرداری",
    person: "سعید",
    priority: "بالا",
    status: "انجام نشده",
    date: "1405/07/02"
  },

  {
    title: "تدوین",
    person: "مهدی",
    priority: "بالا",
    status: "در حال انجام",
    date: "1405/07/03"
  },

  {
    title: "نوشتن کپشن",
    person: "هژان",
    priority: "عادی",
    status: "انجام نشده",
    date: "1405/07/04"
  },

  {
    title: "تأیید نهایی",
    person: "سعید",
    priority: "بالا",
    status: "انجام شده",
    date: "1405/07/05"
  },

  {
    title: "انتشار",
    person: "هژان",
    priority: "عادی",
    status: "انجام نشده",
    date: "1405/07/06"
  }

];



function getPriorityBadge(priority) {

  if (priority === "بالا") {

    return `
      <span class="badge high">
        اولویت بالا
      </span>
    `;

  }


  if (priority === "کم") {

    return `
      <span class="badge">
        اولویت کم
      </span>
    `;

  }


  return `
    <span class="badge">
      اولویت عادی
    </span>
  `;

}



function getStatusBadge(status) {

  if (status === "انجام شده") {

    return `
      <span class="badge green">
        ✓ انجام شده
      </span>
    `;

  }


  if (status === "در حال انجام") {

    return `
      <span class="badge orange">
        ⏳ در حال انجام
      </span>
    `;

  }


  return `
    <span class="badge">
      ○ انجام نشده
    </span>
  `;

}



function openProject() {


  let completed =
    tasks.filter(
      task => task.status === "انجام شده"
    ).length;


  let doing =
    tasks.filter(
      task => task.status === "در حال انجام"
    ).length;


  let pending =
    tasks.filter(
      task => task.status === "انجام نشده"
    ).length;


  let html = `

    <div class="section-title">
      پروژه کافه لیپار
    </div>


    <div class="card">

      <h3>
        📊 وضعیت پروژه
      </h3>

      <div class="info">

        وضعیت:
        <span class="badge blue">
          فعال
        </span>

        <br><br>

        کل تسک‌ها:
        <strong>
          ${tasks.length}
        </strong>

        <br>

        انجام شده:
        <strong>
          ${completed}
        </strong>

        <br>

        در حال انجام:
        <strong>
          ${doing}
        </strong>

        <br>

        انجام نشده:
        <strong>
          ${pending}
        </strong>

      </div>

    </div>


    <div class="section-title">
      🎬 محتواهای پروژه
    </div>


    <div class="card">

      <h3>
        معرفی آیس لاته
      </h3>

      <div class="info">

        <span class="badge">
          Reel
        </span>

        <span class="badge">
          Instagram
        </span>

        <span class="badge blue">
          ایده
        </span>

        <span class="badge high">
          اولویت بالا
        </span>

        <br><br>

        ویدیوی کوتاه معرفی آیس لاته لیپار

      </div>

    </div>


    <div class="section-title">
      ✅ تسک‌های پروژه
    </div>

  `;


  if (tasks.length === 0) {

    html += `

      <div class="card">

        <div class="empty">
          هنوز هیچ تسکی اضافه نشده است.
        </div>

      </div>

    `;

  }



  tasks.forEach(function(task, index) {


    html += `

      <div class="card">

        <h3>
          ${task.title}
        </h3>

        <div class="info">

          👤 مسئول:
          <strong>
            ${task.person}
          </strong>

          <br>

          ${getPriorityBadge(task.priority)}

          ${getStatusBadge(task.status)}

          <br>

          📅 تاریخ انجام:
          <strong>
            ${task.date || "تعیین نشده"}
          </strong>

        </div>


        <div class="task-actions">

          <button
            onclick="changeStatus(${index})"
          >
            تغییر وضعیت
          </button>


          <button
            onclick="deleteTask(${index})"
            class="delete-button"
          >
            حذف تسک
          </button>

        </div>

      </div>

    `;

  });



  html += `

    <div class="card">

      <button
        class="add-button"
        onclick="showAddTaskForm()"
      >
        + افزودن تسک
      </button>

    </div>


    <button
      onclick="location.reload()"
    >
      ← بازگشت به داشبورد
    </button>

  `;


  document.querySelector(
    ".container"
  ).innerHTML = html;

}




function showAddTaskForm() {


  const html = `

    <div class="section-title">
      ➕ افزودن تسک جدید
    </div>


    <div class="card">

      <div class="form-group">

        <label class="form-label">
          عنوان تسک
        </label>

        <input
          id="taskTitle"
          class="form-input"
          type="text"
          placeholder="مثلاً طراحی پست اینستاگرام"
        >

      </div>


      <div class="form-group">

        <label class="form-label">
          مسئول
        </label>

        <select
          id="taskPerson"
          class="form-select"
        >

          <option value="">
            انتخاب مسئول
          </option>

          <option value="سعید">
            سعید
          </option>

          <option value="هژان">
            هژان
          </option>

          <option value="مهدی">
            مهدی
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          اولویت
        </label>

        <select
          id="taskPriority"
          class="form-select"
        >

          <option value="">
            انتخاب اولویت
          </option>

          <option value="کم">
            کم
          </option>

          <option value="عادی">
            عادی
          </option>

          <option value="بالا">
            بالا
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          وضعیت
        </label>

        <select
          id="taskStatus"
          class="form-select"
        >

          <option value="انجام نشده">
            انجام نشده
          </option>

          <option value="در حال انجام">
            در حال انجام
          </option>

          <option value="انجام شده">
            انجام شده
          </option>

        </select>

      </div>


      <div class="form-group">

        <label class="form-label">
          تاریخ انجام
        </label>

        <input
          id="taskDate"
          class="form-input"
          type="text"
          placeholder="مثلاً 1405/07/10"
        >

      </div>


      <div class="form-buttons">

        <button
          class="add-button"
          onclick="saveTask()"
        >
          ✓ افزودن تسک
        </button>


        <button
          class="cancel-button"
          onclick="openProject()"
        >
          لغو
        </button>

      </div>

    </div>

  `;


  document.querySelector(
    ".container"
  ).innerHTML = html;

}



function saveTask() {


  const title =
    document.getElementById(
      "taskTitle"
    ).value.trim();


  const person =
    document.getElementById(
      "taskPerson"
    ).value;


  const priority =
    document.getElementById(
      "taskPriority"
    ).value;


  const status =
    document.getElementById(
      "taskStatus"
    ).value;


  const date =
    document.getElementById(
      "taskDate"
    ).value.trim();



  if (!title) {

    alert(
      "لطفاً عنوان تسک را وارد کن."
    );

    return;

  }


  if (!person) {

    alert(
      "لطفاً مسئول تسک را انتخاب کن."
    );

    return;

  }


  if (!priority) {

    alert(
      "لطفاً اولویت تسک را انتخاب کن."
    );

    return;

  }


  if (!date) {

    alert(
      "لطفاً تاریخ انجام را وارد کن."
    );

    return;

  }



  tasks.push({

    title: title,

    person: person,

    priority: priority,

    status: status,

    date: date

  });


  openProject();

}



function changeStatus(index) {


  const current =
    tasks[index].status;


  let nextStatus;


  if (current === "انجام نشده") {

    nextStatus = "در حال انجام";

  }

  else if (current === "در حال انجام") {

    nextStatus = "انجام شده";

  }

  else {

    nextStatus = "انجام نشده";

  }


  tasks[index].status =
    nextStatus;


  openProject();

}



function deleteTask(index) {


  const confirmDelete =
    confirm(
      "آیا از حذف این تسک مطمئنی؟"
    );


  if (!confirmDelete) {

    return;

  }


  tasks.splice(index, 1);


  openProject();

}

</script>

</body>

</html>
