<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Team</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      color: #202124;
    }

    header {
      background: #111318;
      color: white;
      padding: 28px 20px;
      border-radius: 0 0 28px 28px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      color: #bfc2c8;
      font-size: 15px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .stat-title {
      color: #777;
      font-size: 14px;
    }

    section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .meta {
      color: #777;
      font-size: 14px;
      line-height: 1.8;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 8px;
      background: #eee;
      font-size: 12px;
      margin-left: 5px;
      margin-top: 5px;
    }

    .priority-high {
      background: #ffe1e1;
      color: #b42318;
    }

    .status {
      background: #e8f1ff;
      color: #175cd3;
    }

    .empty {
      background: white;
      padding: 20px;
      border-radius: 16px;
      color: #777;
      text-align: center;
    }

    @media (min-width: 700px) {
      .stats {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Content Team</h1>
  <p>مدیریت تیم تولید محتوا</p>
</header>

<div class="container">

  <!-- آمار -->
  <div class="stats">

    <div class="stat">
      <div class="stat-number" id="projectsCount">0</div>
      <div class="stat-title">پروژه فعال</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="contentsCount">0</div>
      <div class="stat-title">محتوا</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="tasksCount">0</div>
      <div class="stat-title">تسک</div>
    </div>

    <div class="stat">
      <div class="stat-number" id="highTasksCount">0</div>
