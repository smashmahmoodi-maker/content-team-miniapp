<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Content Team</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

header{
  background:#111827;
  color:white;
  padding:22px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:7px 0 0;
  color:#cbd5e1;
}

.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}

/* NAV */

.top-nav{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:20px;
}

.nav-btn{
  background:white;
  color:#374151;
  border:1px solid #e5e7eb;
  margin:0;
  padding:12px 5px;
  font-size:13px;
}

.nav-btn.active{
  background:#111827;
  color:white;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border-radius:14px;
  padding:15px 5px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-number{
  font-size:24px;
  font-weight:bold;
}

.stat-title{
  margin-top:5px;
  color:#64748b;
  font-size:13px;
}

/* GENERAL */

.section-title{
  font-size:20px;
  font-weight:bold;
  margin:25px 0 12px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.card h3{
  margin-top:0;
  margin-bottom:12px;
}

.info{
  color:#64748b;
  line-height:1.9;
}

.badge{
  display:inline-block;
  background:#e5e7eb;
  color:#374151;
  border-radius:8px;
  padding:4px 9px;
  font-size:12px;
  margin:3px;
}

.badge.blue{
  background:#dbeafe;
  color:#1d4ed8;
}

.badge.high{
  background:#fee2e2;
  color:#b91c1c;
}

.badge.green{
  background:#dcfce7;
  color:#15803d;
}

.badge.orange{
  background:#ffedd5;
  color:#c2410c;
}

button{
  width:100%;
  border:none;
  border-radius:12px;
  padding:13px;
  background:#111827;
  color:white;
  font-size:15px;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  opacity:.9;
}

.add-button{
  background:#2563eb;
}

.edit-button{
  background:#dbeafe;
  color:#1d4ed8;
}

.cancel-button{
  background:#e5e7eb;
  color:#374151;
}

.delete-button{
  background:#fee2e2;
  color:#b91c1c;
}

.back-button{
  background:#e5e7eb;
  color:#374151;
}

/* ACTIONS */

.task-actions,
.project-actions{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.task-actions button,
.project-actions button{
  margin-top:0;
  font-size:12px;
  padding:10px 5px;
}

/* FORMS */

.form-group{
  margin-bottom:15px;
}

.form-label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
  color:#374151;
}

.form-input,
.form-select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:14px;
  background:white;
  outline:none;
}

.form-input:focus,
.form-select:focus{
  border-color:#2563eb;
}

.form-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.form-buttons button{
  margin-top:5px;
}

/* MEMBERS */

.members-box{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.member-option{
  display:flex;
  align-items:center;
  gap:7px;
  background:#f8fafc;
  border:1px solid #e2e8f0;
  padding:9px 12px;
  border-radius:10px;
  font-size:13px;
  cursor:pointer;
}

.member-option input{
  width:auto;
}

/* FILTER */

.filter-box{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:14px;
  margin-bottom:15px;
}

.search-input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:14px;
  outline:none;
  margin-bottom:10px;
}

.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.filter-select{
  width:100%;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:13px;
  background:white;
  outline:none;
}

.clear-filter{
  background:#e5e7eb;
  color:#374151;
  margin-top:10px;
  font-size:13px;
  padding:10px;
}

.result-count{
  color:#64748b;
  font-size:13px;
  margin:8px 2px 15px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:20px;
}

/* CALENDAR */

.calendar-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:15px;
}

.calendar-header button{
  width:auto;
  margin:0;
  padding:9px 15px;
  background:#e5e7eb;
  color:#374151;
}

.calendar-title{
  font-size:18px;
  font-weight:bold;
}

.calendar-weekdays,
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:5px;
}

.weekday{
  text-align:center;
  font-size:11px;
  color:#64748b;
  padding:7px 2px;
}

.calendar-day{
  min-height:55px;
  background:#f8fafc;
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:6px;
  text-align:center;
  cursor:pointer;
  position:relative;
}

.calendar-day:hover{
  border-color:#2563eb;
}

.calendar-day.empty-day{
  background:transparent;
  border:none;
  cursor:default;
}

.calendar-day.today{
  border:2px solid #2563eb;
}

.calendar-day.selected{
  background:#dbeafe;
  border-color:#2563eb;
}

.day-number{
  font-size:13px;
  font-weight:bold;
}

.day-task-dot{
  width:6px;
  height:6px;
  background:#2563eb;
  border-radius:50%;
  margin:5px auto 0;
}

.day-task-count{
  font-size:10px;
  color:#2563eb;
  margin-top:2px;
}

.calendar-task{
  border-right:4px solid #2563eb;
}

.calendar-task.high{
  border-right-color:#dc2626;
}

/* NOTIFICATIONS */

.notification-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.notification-count{
  background:#dc2626;
  color:white;
  border-radius:20px;
  padding:5px 10px;
  font-size:12px;
}

.notification{
  border-right:4px solid #2563eb;
  background:#f8fafc;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.notification.overdue{
  border-right-color:#dc2626;
}

.notification.today{
  border-right-color:#f59e0b;
}

.notification-title{
  font-weight:bold;
  margin-bottom:5px;
}

.notification-text{
  color:#64748b;
  font-size:13px;
  line-height:1.8;
}

/* PROGRESS */

.progress-box{
  background:#f8fafc;
  border-radius:12px;
  padding:15px;
  margin-top:12px;
}

.progress-bar{
  width:100%;
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:10px;
}

.progress-fill{
  height:100%;
  background:#2563eb;
  border-radius:20px;
}

/* MOBILE */

@media(max-width:500px){

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .task-actions,
  .project-actions{
    grid-template-columns:1fr;
  }

  .filter-grid{
    grid-template-columns:1fr;
  }

  .calendar-day{
    min-height:48px;
  }

}

</style>

</head>


<body>

<script>

/* =====================================================
   TEAM
===================================================== */

const TEAM_MEMBERS = [
  "سعید",
  "هوژان",
  "مهدی",
  "امیر"
];


/* =====================================================
   STORAGE
===================================================== */

const PROJECTS_KEY =
  "contentTeamProjects_v2";

const TASKS_KEY =
  "contentTeamTasks_v2";


/* =====================================================
   DEFAULT PROJECTS
===================================================== */

const defaultProjects = [

  {
    id:1,
    title:"کافه لیپار",
    description:"تولید و مدیریت محتوای شبکه‌های اجتماعی",
    status:"فعال",
    members:[
      "سعید",
      "هوژان",
      "مهدی",
      "امیر"

  }

];


/* =====================================================
   DEFAULT TASKS
===================================================== */

const defaultTasks = [

  {
    id:1,
    projectId:1,
    title:"فیلمبرداری",
    person:"سعید",
    priority:"بالا",
    status:"انجام نشده",

  },

  {
    id:2,
    projectId:1,
    title:"تدوین",
    person:"مهدی",

  {

  {

    title:"تأیید نهایی",

    priority:"بالا",

    date:"1405/07/05"
  },

  {
    id:5,
    projectId:1,
    title:"انتشار",
    person:"امیر",
    priority:"عادی",
    status:"انجام نشده",
    date:"1405/07/06"
  }

];


/* =====================================================
   LOAD DATA
===================================================== */

let projects =
  loadData(
    PROJECTS_KEY,
    defaultProjects
  );

let tasks =
  loadData(
    TASKS_KEY,
    defaultTasks
  );


function loadData(key,defaultValue){

  const saved =
    localStorage.getItem(key);

  if(!saved){

    localStorage.setItem(
      key,
      JSON.stringify(defaultValue)
    );

    return JSON.parse(
      JSON.stringify(defaultValue)
    );

  }

  try{

    return JSON.parse(saved);

  }
  catch(error){

    localStorage.setItem(
      key,
      JSON.stringify(defaultValue)
    );

    return JSON.parse(
      JSON.stringify(defaultValue)
    );

  }

}


/* =====================================================
   SAVE
===================================================== */

function saveProjects(){

  localStorage.setItem(
    PROJECTS_KEY,
    JSON.stringify(projects)
  );

}


function saveTasks(){

  localStorage.setItem(
    TASKS_KEY,
    JSON.stringify(tasks)
  );

}


/* =====================================================
   ID
===================================================== */

function getNewProjectId(){

  if(projects.length===0){
    return 1;
  }

  return Math.max(
    ...projects.map(p=>p.id)
  ) + 1;

}


function getNewTaskId(){

  if(tasks.length===0){
    return 1;
  }

  return Math.max(
    ...tasks.map(t=>t.id)
  ) + 1;

}


/* =====================================================
   DATE
===================================================== */

function div(a,b){

  return Math.floor(a/b);

}


function jalaliToGregorian(jy,jm,jd){

  jy += 1595;

  let days =
    -355668 +
    (365 * jy) +
    div(jy,33) * 8 +
    div((jy % 33) + 3,4) +
    jd +
    (jm < 7
      ? (jm - 1) * 31
      : ((jm - 7) * 30) + 186
    );


  let gy =
    400 * div(days,146097);


  days %= 146097;


  if(days > 36524){

    gy +=
      100 * div(--days,36524);

    days %= 36524;

    if(days >= 365){

      days++;

    }

  }


  gy +=
    4 * div(days,1461);

  days %= 1461;


  if(days > 365){

    gy +=
      div(days - 1,365);

    days =
      (days - 1) % 365;

  }


  let gd =
    days + 1;


  const monthDays = [

    0,

    31,

    (
      (gy % 4 === 0 && gy % 100 !== 0)
      ||
      gy % 400 === 0
    )
    ? 29
    : 28,

    31,
    30,
    31,
    30,
    31,
    31,
    30,
    31,
    30,
    31

  ];


  let gm=1;


  while(
    gd > monthDays[gm]
  ){

    gd -= monthDays[gm];

    gm++;

  }


  return {
    gy,
    gm,
    gd
  };

}


function gregorianToJalali(gy,gm,gd){

  let g_d_m = [

    0,
    31,
    59,
    90,
    120,
    151,
    181,
    212,
    243,
    273,
    304,
    334

  ];


  let gy2 =
    gy + 1;


  let days =
    355666 +
    (365 * gy) +
    div(gy2,4) -
    div(gy2,100) +
    div(gy2,400) +
    gd +
    g_d_m[gm-1];


  if(
    gm > 2 &&
    (
      (gy % 4 === 0 && gy % 100 !== 0)
      ||
      gy % 400 === 0
    )
  ){

    days++;

  }


  let jy =
    -1595 +
    (33 * div(days,12053));


  days %= 12053;


  jy +=
    4 * div(days,1461);


  days %= 1461;


  if(days > 365){

    jy +=
      div(days - 1,365);

    days =
      (days - 1) % 365;

  }


  let jd =
    days + 1;


  let jm;


  if(jd <= 186){

    jm =
      Math.ceil(jd / 31);

  }
  else{

    jm =
      Math.ceil((jd - 186) / 30) + 6;

  }


  jd =
    jd <= 186
    ?
    ((jd - 1) % 31) + 1
    :
    ((jd - 187) % 30) + 1;


  return {
    jy,
    jm,
    jd
  };

}


function getTodayJalali(){

  const now =
    new Date();

  return gregorianToJalali(
    now.getFullYear(),
    now.getMonth()+1,
    now.getDate()
  );

}


function pad(num){

  return String(num).padStart(2,"0");

}


function makeDate(jy,jm,jd){

  return `${jy}/${pad(jm)}/${pad(jd)}`;

}


function dateNumber(date){

  if(!date){
    return 0;
  }

  const p =
    date.split("/").map(Number);

  if(p.length!==3){
    return 0;
  }

  return (
    p[0]*10000 +
    p[1]*100 +
    p[2]
  );

}


/* =====================================================
   BADGES
===================================================== */

function getPriorityBadge(priority){

  if(priority==="بالا"){

    return `
      <span class="badge high">
        🔥 اولویت بالا
      </span>
    `;

  }

  if(priority==="کم"){

    return `
      <span class="badge">
        اولویت کم
      </span>
    `;

  }

  return `
    <span class="badge">
      اولویت عادی
    </span>
  `;

}


function getStatusBadge(status){

  if(status==="انجام شده"){

    return `
      <span class="badge green">
        ✓ انجام شده
      </span>
    `;

  }

  if(status==="در حال انجام"){

    return `
      <span class="badge orange">
        ⏳ در حال انجام
      </span>
    `;

  }

  return `
    <span class="badge">
      ○ انجام نشده
    </span>
  `;

}


/* =====================================================
   DASHBOARD
===================================================== */

function showDashboard(){

  const completed =
    tasks.filter(
      t=>t.status==="انجام شده"
    ).length;


  const progress =
    tasks.length
    ?
    Math.round(
      completed / tasks.length * 100
    )
    :
    0;


  document.getElementById("app").innerHTML = `

    <div class="top-nav">

      <button
        class="nav-btn active"
        onclick="showDashboard()">

        🏠 داشبورد

      </button>

      <button
        class="nav-btn"
        onclick="showCalendar()">

        📅 تقویم

      </button>

      <button
        class="nav-btn"
        onclick="showNotifications()">

        🔔 اعلان‌ها

      </button>

    </div>


    <div class="stats">

      <div class="stat">

        <div class="stat-number">
          ${projects.length}
        </div>

        <div class="stat-title">
          پروژه
        </div>

      </div>


      <div class="stat">

        <div class="stat-number">
          ${tasks.length}
        </div>

        <div class="stat-title">
          تسک
        </div>

      </div>


      <div class="stat">

        <div class="stat-number">
          ${completed}
        </div>

        <div class="stat-title">
          انجام شده
        </div>

      </div>


      <div class="stat">

        <div class="stat-number">
          ${tasks.filter(
            t=>t.priority==="بالا"
          ).length}
        </div>

        <div class="stat-title">
          اولویت بالا
        </div>

      </div>

    </div>


    <div class="section-title">
      📊 وضعیت کلی
    </div>


    <div class="card">

      <h3>
        پیشرفت کل تیم
      </h3>

      <div class="info">

        ${completed}
        از
        ${tasks.length}
        تسک انجام شده

        <strong>
          ${progress}%
        </strong>

      </div>


      <div class="progress-box">

        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${progress}%">
          </div>

        </div>

      </div>

    </div>


    <div class="section-title">

      📁 پروژه‌ها

    </div>


    <div id="dashboardProjects"></div>


    <div class="card">

      <button
        class="add-button"
        onclick="showAddProjectForm()">

        + افزودن پروژه جدید

      </button>

    </div>

  `;


  renderDashboardProjects();

}


function renderDashboardProjects(){

  const box =
    document.getElementById(
      "dashboardProjects"
    );


  if(!box){
    return;
  }


  if(projects.length===0){

    box.innerHTML = `

      <div class="card">

        <div class="empty">

          هنوز پروژه‌ای ساخته نشده است.

        </div>

      </div>

    `;

    return;

  }


  let html="";


  projects.forEach(project=>{

    const projectTasks =
      tasks.filter(
        t=>t.projectId===project.id
      );


    const completed =
      projectTasks.filter(
        t=>t.status==="انجام شده"
      ).length;


    const progress =
      projectTasks.length
      ?
      Math.round(
        completed /
        projectTasks.length *
        100
      )
      :
      0;


    html += `

      <div class="card">

        <h3>
          📁 ${escapeHtml(project.title)}
        </h3>


        <div class="info">

          ${escapeHtml(
            project.description || ""
          )}

          <br><br>


          <span class="badge blue">
            ${escapeHtml(project.status)}
          </span>


          <span class="badge">
            ${projectTasks.length} تسک
          </span>


          <span class="badge">
            ${project.members.length} عضو
          </span>


          <br><br>


          👥 اعضا:

          <br>

          ${project.members
            .map(
              m=>`
                <span class="badge">
                  ${escapeHtml(m)}
                </span>
              `
            )
            .join("")
          }

        </div>


        <div class="progress-box">

          <strong>
            پیشرفت ${progress}%
          </strong>

          <div class="progress-bar">

            <div
              class="progress-fill"
              style="width:${progress}%">
            </div>

          </div>

        </div>


        <button
          onclick="openProject(${project.id})">

          ورود به پروژه

        </button>


        <div class="project-actions">

          <button
            class="edit-button"
            onclick="showEditProjectForm(${project.id})">

            ✏️ ویرایش

          </button>


          <button
            class="delete-button"
            onclick="deleteProject(${project.id})">

            🗑️ حذف

          </button>


          <button
            onclick="openProject(${project.id})">

            📋 تسک‌ها

          </button>

        </div>

      </div>

    `;

  });


  box.innerHTML=html;

}


/* =====================================================
   PROJECT
===================================================== */

function openProject(projectId){

  const project =
    projects.find(
      p=>p.id===projectId
    );


  if(!project){

    showDashboard();

    return;

  }


  const projectTasks =
    tasks.filter(
      t=>t.projectId===projectId
    );


  const completed =
    projectTasks.filter(
      t=>t.status==="انجام شده"
    ).length;


  const doing =
    projectTasks.filter(
      t=>t.status==="در حال انجام"
    ).length;


  const pending =
    projectTasks.filter(
      t=>t.status==="انجام نشده"

  if(taskArray.length===0){

  let html = `

/* =====================================================
   FILTER PROJECT TASKS
===================================================== */

function filterProjectTasks(
  projectId
){

  const search =
    document.getElementById(
      "searchTask"
    )?.value
    .trim()
    .toLowerCase()
    ||
    "";


  const person =
    document.getElementById(
      "filterPerson"
    )?.value
    ||
    "";


  const status =
    document.getElementById(
      "filterStatus"
    )?.value
    ||
    "";


  const priority =
    document.getElementById(
      "filterPriority"
    )?.value
    ||
    "";


  const filtered =
    tasks
      .map(
        (task,index)=>({
          task,
          index
        })
      )
      .filter(item=>{

        const task =
          item.task;


        if(
          task.projectId !== projectId
        ){

          return false;

        }


        const matchesSearch =
          !search ||
          task.title
            .toLowerCase()
            .includes(search);


        const matchesPerson =
          !person ||
          task.person===person;


        const matchesStatus =
          !status ||
          task.status===status;


        const matchesPriority =
          !priority ||
          task.priority===priority;


        return (
          matchesSearch &&
          matchesPerson &&
          matchesStatus &&
          matchesPriority
        );

      });


  renderProjectTasks(
    projectId,
    filtered
  );

}


function clearProjectFilters(
  projectId
){

  document.getElementById(
    "searchTask"
  ).value="";


  document.getElementById(
    "filterPerson"
  ).value="";


  document.getElementById(
    "filterStatus"
  ).value="";


  document.getElementById(
    "filterPriority"
  ).value="";


  filterProjectTasks(
    projectId
  );

}

function deleteProject(
  projectId
){

  const project =
    projects.find(
      p=>p.id===projectId
    );


  if(!project){
    return;
  }


  const projectTasks =
    tasks.filter(
      t=>t.projectId===projectId
    );


  let message =
    `آیا از حذف پروژه «${project.title}» مطمئنی؟`;


  if(projectTasks.length){

    message +=
      `\n\n${projectTasks.length} تسک این پروژه نیز حذف خواهد شد.`;

  }


  const confirmed =
    confirm(message);


  if(!confirmed){
    return;
  }


  projects =
    projects.filter(
      p=>p.id!==projectId
    );


  tasks =
    tasks.filter(
      t=>t.projectId!==projectId
    );


  saveProjects();

  saveTasks();

  showDashboard();

}

let calendarYear;

let calendarMonth;

let selectedCalendarDate =
  null;


function showCalendar(){

  const today =
    getTodayJalali();


  if(calendarYear===undefined){

    calendarYear =
      today.jy;

    calendarMonth =
      today.jm;

  }


  renderCalendar();

}


function renderCalendar(){

  const monthNames = [

    "",

    "فروردین",
    "اردیبهشت",
    "خرداد",
    "تیر",
    "مرداد",
    "شهریور",
    "مهر",
    "آبان",
    "آذر",
    "دی",
    "بهمن",
    "اسفند"

  ];


  const weekNames = [

    "ش",
    "ی",
    "د",
    "س",
    "چ",
    "پ",
    "ج"

  ];


  const today =
    getTodayJalali();


  const monthLength =
    calendarMonth <= 6
    ?
    31
    :
    calendarMonth <= 11
    ?
    30
    :
    30;


  const firstGregorian =
    jalaliToGregorian(
      calendarYear,
      calendarMonth,
      1
    );


  const firstDate =
    new Date(
      firstGregorian.gy,
      firstGregorian.gm-1,
      firstGregorian.gd
    );


  let firstDay =
    (
      firstDate.getDay()+1
    ) % 7;


  let calendarHTML="";


  for(
    let i=0;
    i<firstDay;
    i++
  ){

    calendarHTML += `
      <div
        class="calendar-day empty-day">
      </div>
    `;

  }


  for(
    let day=1;
    day<=monthLength;
    day++
  ){

    const date =
      makeDate(
        calendarYear,
        calendarMonth,
        day
      );


    const dayTasks =
      tasks.filter(
        task=>task.date===date
      );


    const isToday =
      today.jy===calendarYear &&
      today.jm===calendarMonth &&
      today.jd===day;


    const isSelected =
      selectedCalendarDate===date;


    calendarHTML += `

      <div
        class="
          calendar-day
          ${isToday?"today":""}
          ${isSelected?"selected":""}
        "
        onclick="selectCalendarDate('${date}')">

        <div class="day-number">

          ${day}

        </div>


        ${
          dayTasks.length
          ?

          `

            <div
              class="day-task-dot">
            </div>

            <div
              class="day-task-count">

              ${dayTasks.length}
              تسک

            </div>

          `

          :

          ""

        }

      </div>

    `;

  }


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="top-nav">

      <button
        class="nav-btn"
        onclick="showDashboard()">

        🏠 داشبورد

      </button>


      <button
        class="nav-btn active"
        onclick="showCalendar()">

        📅 تقویم

      </button>


      <button
        class="nav-btn"
        onclick="showNotifications()">

        🔔 اعلان‌ها

      </button>

    </div>


    <div class="section-title">

      📅 تقویم تسک‌ها

    </div>


    <div class="card">

      <div class="calendar-header">

        <button
          onclick="previousMonth()">

          ‹

        </button>


        <div class="calendar-title">

          ${monthNames[calendarMonth]}

          ${calendarYear}

        </div>


        <button
          onclick="nextMonth()">

          ›

        </button>

      </div>


      <div class="calendar-weekdays">

        ${weekNames
          .map(
            day=>
              `<div class="weekday">
                ${day}
              </div>`
          )
          .join("")
        }

      </div>


      <div class="calendar-grid">

        ${calendarHTML}

      </div>

    </div>


    <div
      id="selectedDayTasks">
    </div>

  `;


  if(selectedCalendarDate){

    renderSelectedDayTasks(
      selectedCalendarDate
    );

  }

}


function previousMonth(){

  calendarMonth--;

  if(calendarMonth<1){

    calendarMonth=12;

    calendarYear--;

  }

  selectedCalendarDate=null;

  renderCalendar();

}


function nextMonth(){

  calendarMonth++;

  if(calendarMonth>12){

    calendarMonth=1;

    calendarYear++;

  }

  selectedCalendarDate=null;

  renderCalendar();

}


function selectCalendarDate(
  date
){

  selectedCalendarDate =
    date;

  renderCalendar();

}


function renderSelectedDayTasks(
  date
){

  const box =
    document.getElementById(
      "selectedDayTasks"
    );


  if(!box){
    return;
  }


  const dayTasks =
    tasks.filter(
      task=>task.date===date
    );


  if(dayTasks.length===0){

    box.innerHTML = `

      <div class="card">

        <div class="empty">

          برای
          ${date}
          تسکی ثبت نشده است.

        </div>

      </div>

    `;

    return;

  }


  let html = `

    <div class="section-title">

      📌 تسک‌های
      ${date}

    </div>

  `;


  dayTasks.forEach(
    task=>{

      const project =
        projects.find(
          p=>p.id===task.projectId
        );


      html += `

        <div
          class="
            card
            calendar-task
            ${task.priority==="بالا"
              ?"high"
              :""
            }
          ">

          <h3>

            ${escapeHtml(
              task.title
            )}

          </h3>


          <div class="info">

            📁

            ${
              project
              ?
              escapeHtml(
                project.title
              )
              :
              "پروژه حذف شده"
            }

            <br>


            👤

            ${escapeHtml(
              task.person
            )}


            <br>


            ${getPriorityBadge(
              task.priority
            )}


            ${getStatusBadge(
              task.status
            )}

          </div>

        </div>

      `;

    }
  );


  box.innerHTML =
    html;

}


/* =====================================================
   NOTIFICATIONS
===================================================== */

function getNotifications(){

  const today =
    getTodayJalali();


  const todayNum =
    dateNumber(
      makeDate(
        today.jy,
        today.jm,
        today.jd
      )
    );


  const notifications=[];


  tasks.forEach(
    (task,index)=>{

      if(
        task.status==="انجام شده"
      ){

        return;

      }


      const taskNum =
        dateNumber(
          task.date
        );


      if(!taskNum){

        return;

      }


      const project =
        projects.find(
          p=>p.id===task.projectId
        );


      const projectName =
        project
        ?
        project.title
        :
        "پروژه حذف شده";


      if(taskNum < todayNum){

        notifications.push({

          type:"overdue",

          title:"⚠️ تسک عقب افتاده",

          text:
            `تسک «${task.title}» از پروژه «${projectName}» مربوط به ${task.date} است و هنوز انجام نشده.`,

          index

        });

      }

      else if(
        taskNum===todayNum
      ){

        notifications.push({

          type:"today",

          title:"🔔 تسک امروز",

          text:
            `امروز باید «${task.title}» توسط ${task.person} انجام شود.`,

          index

        });

      }

      else if(
        taskNum <= todayNum+3
      ){

        notifications.push({

          type:"normal",

          title:"📅 تسک نزدیک",

          text:
            `تسک «${task.title}» در تاریخ ${task.date} برنامه‌ریزی شده.`,

          index

        });

      }

    }
  );


  return notifications;

}


function showNotifications(){

  const notifications =
    getNotifications();


  document.getElementById(
    "app"
  ).innerHTML = `

    <div class="top-nav">

      <button
        class="nav-btn"
        onclick="showDashboard()">

        🏠 داشبورد

      </button>


      <button
        class="nav-btn"
        onclick="showCalendar()">

        📅 تقویم

      </button>


      <button
        class="nav-btn active"
        onclick="showNotifications()">

        🔔 اعلان‌ها

      </button>

    </div>


    <div class="section-title">

      <div class="notification-header">

        <span>
          🔔 اعلان‌ها
        </span>


        <span class="notification-count">

          ${notifications.length}

        </span>

      </div>

    </div>


    ${
      notifications.length===0

      ?

      `

        <div class="card">

          <div class="empty">

            🎉

            <br><br>

            فعلاً اعلان مهمی نداری.

          </div>

        </div>

      `

      :

      notifications
        .map(
          notification=>`

            <div
              class="
                notification
                ${
                  notification.type==="overdue"
                  ?
                  "overdue"
                  :
                  ""
                }

                ${
                  notification.type==="today"
                  ?
                  "today"
                  :
                  ""
                }
              ">

              <div
                class="notification-title">

                ${notification.title}

              </div>


              <div
                class="notification-text">

                ${notification.text}

              </div>


              <button
                onclick="
                  showEditTaskForm(
                    ${notification.index}
                  )
                ">

                مشاهده تسک

              </button>

            </div>

          `
        )
        .join("")

    }


    <div class="card">

      <h3>
        🔔 اعلان مرورگر
      </h3>


      <div class="info">

        اگر اجازه اعلان مرورگر را فعال کنی،
        برنامه می‌تواند برای اعلان‌های آینده
        از سیستم اعلان گوشی/کامپیوتر استفاده کند.

      </div>


      <button
        onclick="requestNotificationPermission()">

        فعال کردن اعلان‌ها

      </button>

    </div>

  `;

}


/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

function requestNotificationPermission(){

  if(
    !("Notification" in window)
  ){

    alert(
      "مرورگر این دستگاه از اعلان‌های سیستم پشتیبانی نمی‌کند."
    );

    return;

  }


  Notification
    .requestPermission()
    .then(
      permission=>{

        if(
          permission==="granted"
        ){

          new Notification(
            "Content Team",
            {
              body:
                "اعلان‌های Content Team فعال شد 🔔"
            }
          );


          alert(
            "اعلان‌ها فعال شدند."
          );

        }
        else{

          alert(
            "اجازه اعلان‌ها داده نشد."
          );

        }

      }
    );

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(
  value
){

  if(value===null ||
     value===undefined){

    return "";

  }


  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(
  value
){

  return escapeHtml(
    value
  );

}


/* =====================================================
   START
===================================================== */

showDashboard();

</script>
