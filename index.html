<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Team</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      min-height: 100vh;
      background: white;
    }

    header {
      padding: 25px 20px;
      background: #111;
      color: white;
      border-radius: 0 0 24px 24px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: .7;
    }

    .section {
      padding: 20px;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
    }

    .project,
    .content,
    .task {
      padding: 17px;
      border-radius: 17px;
      background: #f3f3f3;
      margin-bottom: 12px;
    }

    .project-name,
    .content-title,
    .task-title {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .info {
      color: #777;
      font-size: 14px;
    }

    .loading {
      padding: 20px;
      text-align: center;
      color: #777;
    }

    .error {
      margin: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #ffe5e5;
      color: #b00000;
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>Content Team</h1>
    <p>مدیریت تیم تولید محتوا</p>
  </header>

  <div id="app">
    <div class="loading">
      در حال دریافت اطلاعات...
    </div>
  </div>

</div>

<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://lnfvolroihvtchzzwrmi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_vSkJkr5-Fwape45NRBjLsw_cW8wRIqB";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // LOAD DATA
  // =========================

  async function loadData() {

    try {

      const { data: projects, error: projectError } =
        await supabaseClient
          .from("projects")
          .select("*")
          .order("created_at", { ascending: false });

      if (projectError) {
        throw projectError;
      }


      const { data: contents, error: contentError } =
        await supabaseClient
          .from("contents")
          .select("*")
          .order("created_at", { ascending: false });

      if (contentError) {
        throw contentError;
      }


      const { data: tasks, error: taskError } =
        await supabaseClient
          .from("tasks")
          .select("*")
          .order("created_at", { ascending: false });

      if (taskError) {
        throw taskError;
      }


      render(
        projects || [],
        contents || [],
        tasks || []
      );

    } catch (error) {

      console.error(error);

      document.getElementById("app").innerHTML = `
        <div class="error">
          خطا در دریافت اطلاعات از دیتابیس.
          <br><br>
          ${error.message}
        </div>
      `;

    }

  }


  // =========================
  // RENDER
  // =========================

  function render(projects, contents, tasks) {

    let html = "";


    // PROJECTS

    html += `
      <div class="section">

        <div class="section-title">
          📁 پروژه‌ها
        </div>
    `;


    if (projects.length === 0) {

      html += `
        <div class="info">
          هنوز پروژه‌ای ساخته نشده.
        </div>
      `;

    }


    projects.forEach(project => {

      const projectContents =
        contents.filter(
          content => content.project_id === project.id
        );

      const projectTasks =
        tasks.filter(
          task => task.project_id === project.id
        );


      html += `
        <div class="project">

          <div class="project-name">
            📁 ${project.name}
          </div>

          <div class="info">
            ${project.description || ""}
          </div>

          <br>

          <div class="info">
            🎬 ${projectContents.length} محتوا
            &nbsp; • &nbsp;
            ✅ ${projectTasks.length} وظیفه
          </div>

        </div>
      `;

    });


    html += `
      </div>
    `;


    // CONTENTS

    html += `
      <div class="section">

        <div class="section-title">
          🎬 محتواها
        </div>
    `;


    contents.forEach(content => {

      html += `
        <div class="content">

          <div class="content-title">
            🎬 ${content.title}
          </div>

          <div class="info">
            نوع: ${content.content_type || "-"}
          </div>

          <div class="info">
            پلتفرم: ${content.platform || "-"}
          </div>

          <div class="info">
            وضعیت: ${content.status || "-"}
          </div>

        </div>
      `;

    });


    html += `
      </div>
    `;


    // TASKS

    html += `
      <div class="section">

        <div class="section-title">
          📅 وظایف
        </div>
    `;


    tasks.forEach(task => {

      html += `
        <div class="task">

          <div class="task-title">
            ${task.title}
          </div>

          <div class="info">
            وضعیت: ${task.status}
          </div>

          <div class="info">
            اولویت: ${task.priority}
          </div>

        </div>
      `;

    });


    html += `
      </div>
    `;


    document.getElementById("app").innerHTML = html;

  }


  // شروع برنامه
  loadData();

</script>

</body>
</html>
