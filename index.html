<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Content Team</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 22px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    header p {
      margin: 7px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 15px 5px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .stat-number {
      font-size: 24px;
      font-weight: bold;
    }

    .stat-title {
      margin-top: 5px;
      color: #64748b;
      font-size: 13px;
    }

    .section-title {
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0 12px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .info {
      color: #64748b;
      line-height: 1.9;
    }

    .badge {
      display: inline-block;
      background: #e5e7eb;
      color: #374151;
      border-radius: 8px;
      padding: 4px 9px;
      font-size: 12px;
      margin: 3px;
    }

    .badge.blue {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge.high {
      background: #fee2e2;
      color: #b91c1c;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px;
      background: #111827;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.9;
    }

    .add-button {
      background: #2563eb;
    }

    .task-button {
      background: #16a34a;
    }
  </style>
</head>

<body>

<header>
  <h1>Content Team</h1>
  <p>مدیریت تیم تولید محتوا</p>
</header>

<div class="container" id="mainContainer">

  <div class="stats">

    <div class="stat">
      <div class="stat-number">1</div>
      <div class="stat-title">پروژه</div>
    </div>

    <div class="stat">
      <div class="stat-number">1</div>
      <div class="stat-title">محتوا</div>
    </div>

    <div class="stat">
      <div class="stat-number">5</div>
      <div class="stat-title">تسک</div>
    </div>

    <div class="stat">
      <div class="stat-number">3</div>
      <div class="stat-title">اولویت بالا</div>
    </div>

  </div>


  <div class="section-title">
    پروژه‌ها
  </div>


  <div class="card">

    <h3>کافه لیپار</h3>

    <div class="info">
      تولید و مدیریت محتوای شبکه‌های اجتماعی

      <br><br>

      <span class="badge blue">فعال</span>
      <span class="badge">۱ محتوا</span>
      <span class="badge">۵ تسک</span>
    </div>

    <button onclick="openProject()">
      ورود به پروژه
    </button>

  </div>

</div>


<script>

let tasks = [
  {
    title: "فیلمبرداری",
    person: "سعید",
    priority: "بالا"
  },
  {
    title: "تدوین",
    person: "مهدی",
    priority: "بالا"
  },
  {
    title: "نوشتن کپشن",
    person: "هژان",
    priority: "عادی"
  },
  {
    title: "تأیید نهایی",
    person: "سعید",
    priority: "بالا"
  },
  {
    title: "انتشار",
    person: "هژان",
    priority: "عادی"
  }
];


function openProject() {

  let html = `

    <div class="section-title">
      پروژه کافه لیپار
    </div>


    <div class="card">

      <h3>📊 وضعیت پروژه</h3>

      <div class="info">

        وضعیت:
        <span class="badge blue">فعال</span>

        <br>

        محتوا:
        <strong>۱</strong>

        <br>

        تسک:
        <strong>${tasks.length}</strong>

      </div>

    </div>


    <div class="section-title">
      🎬 محتواهای پروژه
    </div>


    <div class="card">

      <h3>معرفی آیس لاته</h3>

      <div class="info">

        <span class="badge">Reel</span>
        <span class="badge">Instagram</span>
        <span class="badge blue">ایده</span>
        <span class="badge high">اولویت بالا</span>

        <br><br>

        ویدیوی کوتاه معرفی آیس لاته لیپار

      </div>

    </div>


    <div class="section-title">
      ✅ تسک‌های پروژه
    </div>

  `;


  tasks.forEach(function(task) {

    let priorityBadge = "";

    if (task.priority === "بالا") {

      priorityBadge =
        '<span class="badge high">اولویت بالا</span>';

    } else {

      priorityBadge =
        '<span class="badge">اولویت عادی</span>';

    }


    html += `

      <div class="card">

        <h3>${task.title}</h3>

        <div class="info">

          مسئول: ${task.person}

          <br>

          ${priorityBadge}

          <span class="badge">
            انجام نشده
          </span>

        </div>

      </div>

    `;

  });


  html += `

    <div class="card">

      <button class="add-button" onclick="addTask()">
        + افزودن تسک
      </button>

    </div>


    <button onclick="location.reload()">
      ← بازگشت به داشبورد
    </button>

  `;


  document.querySelector(".container").innerHTML = html;

}



function addTask() {

  const title = prompt("عنوان تسک را وارد کن:");

  if (!title) {
    return;
  }


  const person = prompt(
    "مسئول تسک را وارد کن:\nسعید / هژان / مهدی"
  );


  if (!person) {
    return;
  }


  const priority = prompt(
    "اولویت را وارد کن:\nبالا / عادی"
  );


  if (!priority) {
    return;
  }


  tasks.push({

    title: title,

    person: person,

    priority: priority

  });


  openProject();

}


</script>

</body>
</html>
